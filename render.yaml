services:
  - type: web
    name: bydhelp-zap
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m gunicorn main:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: YANDEX_TOKEN
        sync: false
