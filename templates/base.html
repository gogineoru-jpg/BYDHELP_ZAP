<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CRM Автозапчасти</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #f8fafc; 
            min-height: 100vh; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px); 
            padding: 15px 25px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); 
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { margin: 0; font-size: 20px; color: #38bdf8; font-weight: 600; }
        .nav-menu { display: flex; gap: 10px; }
        .nav-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #0284c7; }
        .backup-btn { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            transition: background 0.2s; 
        }
        .backup-btn:hover { background: #0369a1; }

        .block { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(10px); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
            margin-bottom: 20px;
        }
        h2 { font-size: 16px; color: #e2e8f0; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; margin-top: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0 12px 0; 
            box-sizing: border-box; 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: #f8fafc; 
            border-radius: 6px; 
            font-size: 14px; 
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 10px; 
            width: 100%; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600; 
            transition: background 0.2s; 
        }
        button:hover { background: #1d4ed8; }
        ul { padding-left: 0; list-style: none; margin: 0; }
        li { 
            background: rgba(15, 23, 42, 0.6); 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 8px; 
            border-left: 4px solid #38bdf8; 
            font-size: 13px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .btn-small { padding: 5px 10px; font-size: 12px; width: auto; background: #16a34a; }
        .btn-small:hover { background: #15803d; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ CRM Автозапчасти</h1>
        <div class="nav-menu">
            <a href="/" class="nav-btn">📊 Главная / Отчеты</a>
            <a href="/products" class="nav-btn">📦 Склад запчастей</a>
            <a href="/orders" class="nav-btn">📋 Заказы и Клиенты</a>
        </div>
        <form action="/manual_backup" method="POST" style="margin: 0; width: auto;">
            <button type="submit" class="backup-btn">💾 Бэкап</button>
        </form>
    </header>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
