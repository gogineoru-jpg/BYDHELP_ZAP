<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CRM Автозапчасти</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .block { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 320px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 18px; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        input, select { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        ul { padding-left: 0; list-style: none; max-height: 400px; overflow-y: auto; }
        li { background: #f9f9f9; margin-bottom: 12px; padding: 10px; border-radius: 6px; border-left: 4px solid #007bff; font-size: 13px; }
        .search-box { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-box input { margin: 0; }
        .search-box button { width: auto; padding: 0 15px; }
        .product-actions { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .product-actions form { display: flex; gap: 4px; width: 100%; align-items: center; }
        .product-actions input { width: 70px; padding: 4px; margin: 0; font-size: 12px; }
        .btn-small { padding: 5px 10px; font-size: 12px; width: auto; background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
    </style>
</head>
<body>
    <h1>CRM для подбора автозапчастей</h1>
    <div class="container">
        
        <!-- Блок 1: Добавление товара на склад -->
        <div class="block">
            <h2>1. Добавить запчасть</h2>
            <form action="/add_product" method="POST">
                <input type="text" name="oem" placeholder="OEM / Артикул (обязательно)" required>
                <input type="text" name="name" placeholder="Название детали (обязательно)" required>
                <input type="text" name="brand" placeholder="Бренд / Производитель">
                <input type="number" step="0.01" name="purchase_price" placeholder="Закупочная цена ($)">
                <input type="number" step="0.01" name="sell_price" placeholder="Цена продажи ($)">
                <input type="number" name="stock" placeholder="Количество (шт.)" value="1">
                <button type="submit">Добавить в базу</button>
            </form>
        </div>

        <!-- Блок 2: Поиск и Каталог запчастей -->
        <div class="block">
            <h2>2. Склад и Поиск</h2>
            <form action="/" method="GET" class="search-box">
                <input type="text" name="q" placeholder="Поиск по OEM или названию..." value="{{ query }}">
                <button type="submit">Найти</button>
            </form>
            <ul>
                {% for p in products %}
                <li>
                    <strong>{{ p.oem }}</strong> — {{ p.name }} (<i>{{ p.brand }}</i>)<br>
                    Цена: <b>${{ p.sell_price }}</b> | Остаток: <b>{{ p.stock }} шт.</b>
                    
                    <!-- Форма изменения и удаления товара -->
                    <div class="product-actions">
                        <form action="/edit_product/{{ p.id }}" method="POST">
                            <input type="text" name="name" value="{{ p.name }}" title="Название" style="width: 110px;">
                            <input type="number" step="0.01" name="sell_price" value="{{ p.sell_price }}" title="Цена ($)" style="width: 60px;">
                            <input type="number" name="stock" value="{{ p.stock }}" title="Количество" style="width: 50px;">
                            <button type="submit" class="btn-small">ОК</button>
                        </form>
                        <form action="/delete_product/{{ p.id }}" method="POST" style="margin-top: 4px;">
                            <button type="submit" class="btn-small btn-danger" onclick="return confirm('Удалить эту запчасть?');">Удалить</button>
                        </form>
                    </div>
                </li>
                {% else %}
                <p style="color: #777; text-align: center;">Ничего не найдено</p>
                {% endfor %}
            </ul>
        </div>

        <!-- Блок 3: Клиент и Сделка -->
        <div class="block">
            <h2>3. Клиент и Сделка</h2>
            <input type="text" placeholder="Имя клиента или телефон">
            <input type="text" placeholder="VIN-код автомобиля (17 символов)">
            <select>
                <option>Запрос поступил</option>
                <option>Идет подбор аналогов</option>
                <option>Согласовано с клиентом</option>
                <option>Заказ оплачен</option>
                <option>Выдано со склада</option>
            </select>
            <h3>Итого: $0</h3>
            <button style="background: #28a745;">Сохранить сделку</button>
        </div>

    </div>
</body>
</html>
